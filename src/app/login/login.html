<div class="min-h-screen w-full box-border flex flex-col relative overflow-x-hidden bg-[#0a0e18] light:bg-white">

  <!-- =====================================================
       HEADER BLOB (fixed brand color, not theme-aware)
  ====================================================== -->

  <div class="relative box-border pt-[26px] pb-[26px] px-[26px] [background:linear-gradient(160deg,#6366f1,#4338ca)] rounded-b-[42px]">

    <a
      routerLink="/"
      class="relative group inline-flex items-center gap-[7px] text-white/85 text-[14px] font-semibold no-underline hover:text-white"
    >
      <span aria-hidden="true">←</span>
      Back

      <span class="pointer-events-none absolute left-0 top-full mt-[6px] whitespace-nowrap px-[10px] py-[6px] rounded-[7px] text-[12px] font-semibold text-white bg-[#1c2432] border border-[#2a3648] shadow-[0_8px_20px_rgba(0,0,0,.35)] opacity-0 scale-95 transition-[opacity,transform] duration-150 z-[1100] group-hover:opacity-100 group-hover:scale-100">
        Return to home
      </span>
    </a>

  </div>


  <!-- =====================================================
       BODY PANEL
  ====================================================== -->

  <div class="flex-1 w-full box-border flex flex-col items-center px-[26px] pt-[32px] pb-[36px] max-[380px]:px-[18px]">


    <!-- =====================================================
         SKELETON (Instagram-style placeholder before the real
         form appears)
    ====================================================== -->

    <div
      class="w-full max-w-[420px] animate-pulse"
      *ngIf="!pageReady()"
    >

      <div class="w-full h-[44px] rounded-full bg-[#141a29] light:bg-[#e5e7eb] mb-[24px]"></div>

      <div class="w-full h-[54px] rounded-[16px] bg-[#141a29] light:bg-[#e5e7eb] mb-[16px]"></div>
      <div class="w-full h-[54px] rounded-[16px] bg-[#141a29] light:bg-[#e5e7eb] mb-[16px]"></div>
      <div class="w-full h-[54px] rounded-[16px] bg-[#141a29] light:bg-[#e5e7eb] mb-[16px]"></div>

      <div class="w-full h-[56px] rounded-full bg-[#141a29] light:bg-[#e5e7eb] mt-[8px] mb-[24px]"></div>

      <div class="w-[170px] h-[13px] rounded-[4px] bg-[#141a29] light:bg-[#e5e7eb] mx-auto mb-[25px]"></div>

      <div class="w-[140px] h-[11px] rounded-[4px] bg-[#141a29] light:bg-[#e5e7eb] mx-auto"></div>

    </div>


    <div class="w-full max-w-[420px]" *ngIf="pageReady()">


      <!-- =====================================================
           GOOGLE SIGN-IN
      ====================================================== -->

      <div
        class="w-full mb-[24px]"
        *ngIf="googleAvailable"
      >

        <div id="google-signin-button" class="flex justify-center min-h-[44px]"></div>

        <div class="flex items-center gap-[14px] mt-[20px] text-[#566174] text-[12px] light:text-[#9ca3af] before:content-[''] before:flex-1 before:h-px before:bg-[#202938] light:before:bg-[#e5e7eb] after:content-[''] after:flex-1 after:h-px after:bg-[#202938] light:after:bg-[#e5e7eb]">
          <span>or continue with email</span>
        </div>

      </div>


      <!-- =====================================================
           LOGIN FORM
      ====================================================== -->

      <form
        class="w-full box-border"
        (ngSubmit)="login()"
        novalidate
      >


        <!-- ===================================================
             REGISTERED SUCCESS
        ==================================================== -->

        <div
          class="w-full box-border bg-[rgba(34,197,94,0.1)] border border-[rgba(34,197,94,0.25)] text-[#4ade80] p-[12px] rounded-[10px] text-[13px] leading-[1.4] mb-[16px] break-words"
          *ngIf="registeredMessage()"
        >

          {{ registeredMessage() }}

        </div>


        <!-- ===================================================
             USERNAME
        ==================================================== -->

        <div class="w-full mb-[16px] box-border">

          <div class="input-wrapper relative w-full box-border">

            <span class="absolute left-[18px] top-1/2 -translate-y-1/2 w-[18px] h-[18px] text-[#5b6577] flex items-center justify-center z-[1] pointer-events-none light:text-[#9ca3af]" aria-hidden="true">

              <svg
                class="w-[18px] h-[18px] block"
                viewBox="0 0 24 24"
                fill="none"
                xmlns="http://www.w3.org/2000/svg"
              >

                <circle
                  cx="12"
                  cy="8"
                  r="3.5"
                  stroke="currentColor"
                  stroke-width="1.8"
                />

                <path
                  d="M5 20C5.8 16.7 8.2 14.8 12 14.8C15.8 14.8 18.2 16.7 19 20"
                  stroke="currentColor"
                  stroke-width="1.8"
                  stroke-linecap="round"
                />

              </svg>

            </span>

            <input
              id="username"
              type="text"
              name="username"
              [(ngModel)]="username"
              placeholder="Username"
              autocomplete="username"
              class="block w-full max-w-full h-[54px] box-border rounded-[16px] border-0 bg-[#141a29] text-white outline-none text-[15px] transition-[background,box-shadow] duration-200 ease-in-out placeholder:text-[#5b6577] focus:bg-[#182036] focus:shadow-[0_0_0_3px_rgba(99,102,241,.25)] light:bg-[#f3f4f6] light:text-[#111827] light:placeholder:text-[#9ca3af] light:focus:bg-[#ececf5]"
              style="font-family: inherit; padding: 0 16px 0 48px;"
            />

          </div>

        </div>


        <!-- ===================================================
             EMAIL
        ==================================================== -->

        <div class="w-full mb-[16px] box-border">

          <div class="input-wrapper relative w-full box-border">

            <span class="absolute left-[18px] top-1/2 -translate-y-1/2 w-[18px] h-[18px] text-[#5b6577] flex items-center justify-center z-[1] pointer-events-none light:text-[#9ca3af]" aria-hidden="true">

              <svg
                class="w-[18px] h-[18px] block"
                viewBox="0 0 24 24"
                fill="none"
                xmlns="http://www.w3.org/2000/svg"
              >

                <rect
                  x="3.5"
                  y="5"
                  width="17"
                  height="14"
                  rx="2"
                  stroke="currentColor"
                  stroke-width="1.8"
                />

                <path
                  d="M4.5 7L12 13L19.5 7"
                  stroke="currentColor"
                  stroke-width="1.8"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                />

              </svg>

            </span>

            <input
              id="email"
              type="email"
              name="email"
              [(ngModel)]="email"
              placeholder="Gmail"
              autocomplete="email"
              class="block w-full max-w-full h-[54px] box-border rounded-[16px] border-0 bg-[#141a29] text-white outline-none text-[15px] transition-[background,box-shadow] duration-200 ease-in-out placeholder:text-[#5b6577] focus:bg-[#182036] focus:shadow-[0_0_0_3px_rgba(99,102,241,.25)] light:bg-[#f3f4f6] light:text-[#111827] light:placeholder:text-[#9ca3af] light:focus:bg-[#ececf5]"
              style="font-family: inherit; padding: 0 16px 0 48px;"
            />

          </div>

        </div>


        <!-- ===================================================
             PASSWORD
        ==================================================== -->

        <div class="w-full mb-[16px] box-border">

          <div class="input-wrapper relative w-full box-border">

            <span class="absolute left-[18px] top-1/2 -translate-y-1/2 w-[18px] h-[18px] text-[#5b6577] flex items-center justify-center z-[1] pointer-events-none light:text-[#9ca3af]" aria-hidden="true">

              <svg
                class="w-[18px] h-[18px] block"
                viewBox="0 0 24 24"
                fill="none"
                xmlns="http://www.w3.org/2000/svg"
              >

                <rect
                  x="5"
                  y="10"
                  width="14"
                  height="10"
                  rx="2"
                  stroke="currentColor"
                  stroke-width="1.8"
                />

                <path
                  d="M8 10V7.5C8 5.3 9.8 3.5 12 3.5C14.2 3.5 16 5.3 16 7.5V10"
                  stroke="currentColor"
                  stroke-width="1.8"
                  stroke-linecap="round"
                />

                <circle
                  cx="12"
                  cy="15"
                  r="1"
                  fill="currentColor"
                />

              </svg>

            </span>

            <input
              id="password"
              type="password"
              name="password"
              [(ngModel)]="password"
              placeholder="Password"
              autocomplete="current-password"
              class="block w-full max-w-full h-[54px] box-border rounded-[16px] border-0 bg-[#141a29] text-white outline-none text-[15px] transition-[background,box-shadow] duration-200 ease-in-out placeholder:text-[#5b6577] focus:bg-[#182036] focus:shadow-[0_0_0_3px_rgba(99,102,241,.25)] light:bg-[#f3f4f6] light:text-[#111827] light:placeholder:text-[#9ca3af] light:focus:bg-[#ececf5]"
              style="font-family: inherit; padding: 0 16px 0 48px;"
            />

          </div>

        </div>


        <!-- ===================================================
             ERROR
        ==================================================== -->

        <div
          class="w-full box-border bg-[rgba(239,68,68,0.1)] border border-[rgba(239,68,68,0.25)] text-[#f87171] p-[12px] rounded-[10px] text-[13px] leading-[1.4] mb-[16px] break-words"
          *ngIf="loginError()"
        >

          {{ loginError() }}

        </div>


        <!-- ===================================================
             LOGIN BUTTON
        ==================================================== -->

        <button
          type="submit"
          class="group w-full h-[56px] box-border border-0 rounded-full text-white text-[16px] font-bold cursor-pointer flex items-center justify-center gap-[12px] m-0 mt-[8px] appearance-none [background:linear-gradient(135deg,#6366f1,#4f46e5)] transition-[transform,box-shadow,opacity] duration-[250ms] ease-in-out shadow-[0_12px_30px_rgba(79,70,229,.3)] hover:-translate-y-[2px] hover:shadow-[0_16px_35px_rgba(79,70,229,.4)] active:translate-y-0 disabled:opacity-70 disabled:cursor-not-allowed disabled:!translate-y-0 focus-visible:outline-2 focus-visible:outline-[#818cf8] focus-visible:outline-offset-[3px]"
          style="font-family: inherit; padding: 0 20px;"
          [disabled]="submitting()"
        >

          <span class="inline-block text-white leading-none">
            {{ submitting() ? 'Logging in...' : 'Login' }}
          </span>

          <span
            class="inline-flex items-center justify-center text-white text-[21px] leading-none -translate-y-px transition-transform duration-200 ease-in-out group-hover:[transform:translate(3px,-1px)]"
            aria-hidden="true"
            *ngIf="!submitting()"
          >
            →
          </span>

          <svg
            class="animate-spin w-[18px] h-[18px] text-white"
            viewBox="0 0 24 24"
            fill="none"
            aria-hidden="true"
            *ngIf="submitting()"
          >
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4" />
            <path class="opacity-90" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z" />
          </svg>

        </button>

      </form>


      <!-- =====================================================
           SWITCH TO REGISTER
      ====================================================== -->

      <div class="text-center text-[#8b95a7] text-[13px] mt-[24px] light:text-[#6b7280]">

        Don't have an account?

        <a routerLink="/register" class="text-[#818cf8] font-semibold no-underline ml-[4px] hover:underline light:text-[#4338ca]">
          Sign up
        </a>

      </div>


      <!-- =====================================================
           FOOTER
      ====================================================== -->

      <div class="text-center text-[#4b5563] text-[11px] mt-[25px] leading-[1.4] light:text-[#9ca3af]">

        <span>
          Secure Finance Management
        </span>

      </div>

    </div>

  </div>

</div>
